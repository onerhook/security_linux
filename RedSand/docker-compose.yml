version: '3.8'

# =============================================================================
# RedSand Secure - Максимально защищенная конфигурация Docker Compose
# С учетом всех лучших практик безопасности
# =============================================================================

services:
  # ===========================================================================
  # Основной сервис анализа вредоносного ПО
  # ===========================================================================
  redsand-analyzer:
    build:
      context: .
      dockerfile: Dockerfile.secure
    container_name: redsand-secure-sandbox
    hostname: redsand-sandbox-isolated
    
    # Restart policy
    restart: unless-stopped
    
    # =========================================================================
    # Security: Read-only корневая файловая система
    # =========================================================================
    read_only: true
    
    # =========================================================================
    # Security: Временные файловые системы с ограничениями
    # =========================================================================
    tmpfs:
      # /tmp с noexec и nosuid для предотвращения выполнения вредоносного кода
      - /tmp:size=100M,mode=1777,noexec,nosuid
      # Логи с ограниченным размером
      - /app/logs:size=50M,mode=755,noexec,nosuid
      # Отчеты
      - /app/reports:size=200M,mode=755,noexec,nosuid
      # Кэш
      - /app/cache:size=100M,mode=755,noexec,nosuid
    
    # =========================================================================
    # Security: Volume mounts с минимальными правами
    # =========================================================================
    volumes:
      # Samples - только чтение!
      - ./samples:/app/samples:ro
      # Reports - чтение/запись для сохранения отчетов
      - ./reports:/app/reports:rw
      # Quarantine - изолированная директория для опасных файлов
      - ./quarantine:/app/quarantine:rw
      # Config - только чтение конфигурации
      - ./config:/app/config:ro
      # Seccomp профиль
      - ./seccomp_profile.json:/app/seccomp_profile.json:ro
      # AppArmor профиль
      - ./apparmor_profile:/app/apparmor_profile:ro
    
    # =========================================================================
    # Security: Переменные окружения
    # =========================================================================
    environment:
      # Режим безопасности
      - REDSAND_ENV=production
      - REDSAND_SECURITY_LEVEL=maximum
      - SECURE_MODE=true
      # Логирование
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      - PYTHONFAULTHANDLER=1
      - PYTHONAUDIT=1
      # Ресурсы
      - MAX_WORKERS=2
      - MEMORY_LIMIT_MB=256
      - CPU_LIMIT_PERCENT=50
      - TIMEOUT_SECONDS=60
      # Безопасность
      - NETWORK_ENABLED=false
      - QUARANTINE_ENABLED=true
      # Пути
      - HOME=/home/redsand
      - TMPDIR=/tmp
      - TEMP=/tmp
    
    # =========================================================================
    # Security: Ограничения ресурсов (Docker Compose v3)
    # =========================================================================
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
          pids: 50
        reservations:
          cpus: '0.5'
          memory: 128M
    
    # Альтернативный синтаксис для Docker Compose v2.x
    cpus: 2.0
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 50
    
    # =========================================================================
    # Security: Изоляция сети
    # =========================================================================
    networks:
      - redsand-isolated
    
    # =========================================================================
    # Security: Network mode - none для полной изоляции
    # Используйте это вместо networks для максимальной безопасности
    # network_mode: "none"
    
    # =========================================================================
    # Security: Порты не экспонируются по умолчанию (air-gapped)
    # =========================================================================
    # ports: []  # Нет доступа к портам
    
    # Если нужен API режим (раскомментировать с осторожностью!)
    # ports:
    #   - "127.0.0.1:8080:8080"  # Только localhost!
    
    # =========================================================================
    # Security: Опции безопасности
    # =========================================================================
    security_opt:
      # Запрет на получение новых привилегий
      - no-new-privileges:true
      # AppArmor профиль (если доступен)
      - apparmor:docker-default
      # Seccomp профиль (путь относительно проекта)
      - seccomp:./seccomp_profile.json
    
    # =========================================================================
    # Security: Drop всех capabilities
    # =========================================================================
    cap_drop:
      - ALL
    
    # =========================================================================
    # Security: Минимально необходимые capabilities
    # =========================================================================
    cap_add:
      - CHOWN  # Для смены владельца файлов
      # - SETUID  # Раскомментировать если нужно
      # - SETGID  # Раскомментировать если нужно
    
    # =========================================================================
    # Security: Изоляция IPC
    # =========================================================================
    ipc: none
    
    # =========================================================================
    # Security: Изоляция PID namespace
    # =========================================================================
    pid: none
    
    # =========================================================================
    # Security: Ulimits для предотвращения DoS
    # =========================================================================
    ulimits:
      nofile:
        soft: 1024
        hard: 1024
      nproc:
        soft: 50
        hard: 50
      core:
        soft: 0
        hard: 0
    
    # =========================================================================
    # Security: Конфигурация логирования
    # =========================================================================
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    
    # =========================================================================
    # Security: Health check
    # =========================================================================
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys; sys.exit(0 if os.path.exists('/app/redsand_secure.py') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
      start_interval: 5s
    
    # =========================================================================
    # Command override
    # =========================================================================
    # command: >
    #   python redsand_secure.py
    #   --input /app/samples
    #   --output /app/reports
    #   --workers 2
    #   --timeout 60
    #   --verbose
    #   --secure-mode
    
    # =========================================================================
    # Depends on (если используются дополнительные сервисы)
    # =========================================================================
    depends_on:
      - redsand-cache
  
  # ===========================================================================
  # Redis cache для кэширования результатов анализа
  # ===========================================================================
  redsand-cache:
    image: redis:7-alpine
    container_name: redsand-cache-isolated
    restart: unless-stopped
    
    # Security: Non-root пользователь
    user: "10001:10001"
    
    # Security: Read-only filesystem
    read_only: true
    
    # Security: Temporary filesystem
    tmpfs:
      - /tmp:size=50M,mode=1777,noexec,nosuid
    
    # Security: Network isolation
    networks:
      - redsand-isolated
    
    # Security: Volume для персистентности
    volumes:
      - redis-data:/data
    
    # Security: Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
          pids: 20
    
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 20
    
    # Security: Drop capabilities
    cap_drop:
      - ALL
    
    # Security: No ports exposed (internal only)
    # ports: []
    
    # Security: Logging
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    
    # Security: Health check
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    
    # Security: Command с ограничениями
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --bind 127.0.0.1
      --protected-mode yes
      --requirepass ${REDIS_PASSWORD:-SecureRandomPassword123!}

# =============================================================================
# Networks: Изолированная сеть без внешнего доступа
# =============================================================================
networks:
  redsand-isolated:
    driver: bridge
    # internal: true  # Полная изоляция - нет доступа наружу
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
    # Driver options для дополнительной изоляции
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
      com.docker.network.bridge.enable_ip_masquerade: "false"

# =============================================================================
# Volumes: Персистентные данные
# =============================================================================
volumes:
  redis-data:
    driver: local
    # Driver options для безопасности
    driver_opts:
      type: none
      o: bind
      device: ./redis-data

# =============================================================================
# Secrets: Чувствительные данные (для Docker Swarm)
# =============================================================================
# secrets:
#   redis_password:
#     external: true
#   api_key:
#     external: true
